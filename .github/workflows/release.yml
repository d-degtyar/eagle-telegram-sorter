name: Build release archive

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the plugin
        run: zip -r eagle-telegram-sorter.zip manifest.json index.html style.css logo.png js
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: eagle-telegram-sorter.zip
